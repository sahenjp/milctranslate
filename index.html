<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#181817">
  <meta name="description" content="自然文とMiL;Cを相互変換する軽量なWebアプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>MiL;C Translate</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>MiL;C Translate</h1>
        <p class="lead">自然文 ⇄ MiL;C。入力したそばから変換。</p>
      </div>
      <div class="controls">
        <div class="segment" role="group" aria-label="変換方向">
          <button id="toMilc" aria-pressed="true">→ MiL;C</button>
          <button id="toJa" aria-pressed="false">→ 日本語</button>
        </div>
        <select id="objective" aria-label="圧縮基準">
          <option value="tokens">トークン寄り</option>
          <option value="bytes">最小バイト寄り</option>
        </select>
        <button id="install" class="small-button" hidden>インストール</button>
      </div>
    </header>

    <section class="editors">
      <div class="pane">
        <div class="pane-head"><span id="inputLabel">自然文</span><span id="inputMeta" class="meta">0字 / 0B</span></div>
        <textarea id="input" spellcheck="false" autocomplete="off" placeholder="文章を貼り付ける"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head"><span id="outputLabel">MiL;C</span><span id="outputMeta" class="meta">0字 / 0B</span></div>
        <textarea id="output" spellcheck="false" readonly placeholder="変換結果"></textarea>
      </div>
    </section>

    <div class="bottom">
      <button id="copy" class="primary">コピー</button>
      <button id="share">共有リンク</button>
      <button id="clear">クリア</button>
      <span class="saved">バイト削減 <strong id="savedMeta">—</strong></span>
      <p class="hint">MiL;Cは固定文法ではないため、このアプリは記号・略語・aliasを使う実用的な方言として変換します。未知語は消さずに残します。</p>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
